# .github/workflows/run-tests-fast.yml
#
# Fast CI
name: Run tests-fast

on:
  # Runs on every PR to main.
  pull_request:
    branches: ['main']  # PRs targeting main.

  # Runs on pushes to main.
  push:
    branches: ['main']  # Direct commits and merges into main.

  workflow_dispatch:    # Allows manual run from GitHub UI.

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go Task
        uses: arduino/setup-task@v3

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests, lint, formatting, and type checks
        run: task check
